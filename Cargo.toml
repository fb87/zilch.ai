[profile.release]
strip = true

[workspace]
resolver = "2"
members = ["crates/zilch", "crates/zilch-ipc", "crates/zilch-kernel", "crates/zilch-drivers", "crates/zilch-agents"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["Si Dao"]
repository = "https://github.com/fb87/zilch.ai"
description = "A minimal, extensible coding agent for any OpenAI-compatible API: a read-only, TODO-driven master coordinating parallel workers."

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
