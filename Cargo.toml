[workspace]
resolver = "2"
members = ["crates/zilch-core", "crates/zilch-cli", "crates/zilch-ipc", "crates/zilch-kernel", "crates/zilch-drivers", "crates/zilch-agents"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
authors = ["Si Dao"]
repository = "https://github.com/fb87/zilch.ai"
description = "A minimal, extensible coding agent for any OpenAI-compatible API: a read-only, TODO-driven master coordinating parallel workers."

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
