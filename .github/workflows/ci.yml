name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - name: test
        shell: bash
        env:
          PROPTEST_CASES: "2000"
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee test.log
      # Job logs need auth to download; annotations are public, so surface failures there.
      - name: report test failures
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          grep -E "^---- |panicked at|assertion|left:|right:|Error|error\[" test.log | head -60 |
            while IFS= read -r line; do echo "::error title=test failure (${{ matrix.os }})::${line}"; done

  # Live tests against a FREE model; runs only when the secret is configured.
  live:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: live corner cases + compaction (free model)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        if: env.OPENCODE_API_KEY != ''
        run: |
          cargo test -p zilch-core --test live_corners -- --ignored --test-threads=2
          cargo test -p zilch-core --test live_compaction -- --ignored
