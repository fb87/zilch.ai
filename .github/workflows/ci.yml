name: ci
on:
  push:
    branches: [main, "dev/**", "fea/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee test.log
      # Job logs need auth to download; annotations are public, so surface failures there.
      - name: report test failures
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          grep -E -A3 "^---- |panicked at|assertion|left:|right:|Error|error\[" test.log | head -80 |
            while IFS= read -r line; do echo "::error title=test failure (${{ matrix.os }})::${line}"; done

